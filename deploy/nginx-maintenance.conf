server {
    listen 80;
    listen [::]:80;
    server_name simki.cc www.simki.cc;
    server_tokens off;
    location / {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMKA: перенос сайта</title><body><main><h1>SIMKA</h1><p>Переносим магазин на новый сервер.</p><p>Оформление заказов временно недоступно. Пожалуйста, зайдите позже.</p></main></body></html>';
    }
}
