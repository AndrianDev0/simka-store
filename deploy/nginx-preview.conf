server {
    listen 80;
    listen [::]:80;
    server_name simki.cc www.simki.cc;
    server_tokens off;
    return 301 https://simki.cc$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name simki.cc www.simki.cc;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/simki.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simki.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /srv/simka/preview;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache" always;
    location /api/ { return 503; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
