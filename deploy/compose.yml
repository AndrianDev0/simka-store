name: simka
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file: /srv/simka/secrets/database.env
    volumes:
      - database:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simka -d simka"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      options: {max-size: "10m", max-file: "3"}
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: /srv/simka/secrets/app.env
    environment:
      DATABASE_SSL: disable
      NEXT_PUBLIC_SITE_URL: https://simki.cc
      SEED_DEMO_DATA: "false"
      GEOIP_TRUST_PROXY: "true"
      GEOIP_DATABASE_PATH: /var/lib/simka-geoip/dbip-city-lite.mmdb
      CATALOG_UPLOAD_DIR: /app/public/uploads/catalog
    volumes:
      - /srv/simka/geoip:/var/lib/simka-geoip:ro
      - /srv/simka/uploads:/app/public/uploads
    ports: ["127.0.0.1:3100:3000"]
    networks: [private, outbound]
    depends_on:
      db: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      options: {max-size: "10m", max-file: "3"}
networks:
  private:
    internal: true
  outbound: {}
volumes:
  database: {}
