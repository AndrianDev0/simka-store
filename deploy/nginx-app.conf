server {
    listen 80;
    listen [::]:80;
    server_name simki.cc www.simki.cc;
    server_tokens off;
    return 301 https://simki.cc$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name simki.cc www.simki.cc;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/simki.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simki.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_read_timeout 90s;
    }
}
